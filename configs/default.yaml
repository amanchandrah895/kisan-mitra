# Kisan Mitra — default configuration (tuned for a free Colab T4, 15 GB VRAM)

paths:
  corpus_dir: data/corpus
  testset: data/eval/testset.jsonl
  results_dir: results
  audio_dir: data/eval/audio_tts        # synthetic test audio is generated here

models:
  agriparam: bharatgenai/AgriParam                         # domain LLM (BharatGen), 2.9B, Hindi+English
  param1: bharatgenai/Param-1-2.9B-Instruct                # general LLM baseline (BharatGen)
  indic_en: ai4bharat/indictrans2-indic-en-dist-200M       # gated: accept terms on HF
  en_indic: ai4bharat/indictrans2-en-indic-dist-200M       # gated: accept terms on HF
  asr: ai4bharat/indic-conformer-600m-multilingual         # gated: accept terms on HF
  embedder: intfloat/multilingual-e5-base
  reranker: cross-encoder/ms-marco-MiniLM-L-6-v2
  nli: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli

retrieval:
  chunk_words: 160
  chunk_overlap: 30
  candidate_k: 10        # candidates from each first-stage retriever
  top_k: 3               # chunks passed to the LLM
  mode: hybrid_rerank    # bm25 | dense | hybrid | hybrid_rerank
  rrf_k: 60

router:
  abstain_threshold: 0.0   # cross-encoder relevance logit of the best chunk; below => abstain
  enable_tool: true
  enable_abstain: true
  enable_safety_note: true

generation:
  max_new_tokens: 160
  repetition_penalty: 1.1
  max_context_tokens: 1100   # AgriParam/Param1 have a 2048-token window
  dtype: auto                # auto => fp16 on T4 (bf16 on Ampere+); falls back to fp32 if logits are non-finite
  agriparam_rag_template: "<context> {context} <user> {question} <assistant>"
  agriparam_closed_template: "<user> {question} <assistant>"
  param1_system_prompt: >-
    You are Kisan Mitra, an agricultural advisor for Indian farmers. Answer the question
    using only the information in the context. Give the specific numbers, doses and timings
    from the context. Keep the answer short (2-4 sentences). If the context does not contain
    the answer, say that you do not know.

grounding:
  entail_threshold: 0.5      # NLI entailment probability for a sentence to count as supported
  caveat_below: 0.5          # full system adds a caveat if < 50% of sentences are supported

translation:
  num_beams: 5
  max_length: 256

asr:
  decoding: [ctc, rnnt]

languages: [en, hi, kn, ta]
