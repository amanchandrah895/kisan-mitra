[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kisan-mitra"
version = "1.0.0"
description = "Multilingual, grounded farmer advisory assistant (BharatGen AgriParam + AI4Bharat IndicTrans2/IndicConformer)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
